spec_version: "0.1.0"
name: sage-stem-explainer
version: "0.2.0"
description: >-
  STEM concept-explanation agent from the QUMA AI multi-agent platform.
  Sage turns dense technical material into clear, step-by-step reasoning
  a learner can follow and verify independently. Supports English and Hindi
  explanations with a built-in maker/checker review workflow.

author:
  name: Naman Swami
  email: kgfg00100@gmail.com
  github: naman-swami

license: MIT

tags:
  - stem
  - education
  - explainer
  - multi-agent
  - bilingual
  - opengap
  - portable
  - claw-worker
  - migration

categories:
  - Education
  - STEM
  - Tutoring

model:
  preferred: llama-3.3-70b-versatile
  fallback:
    - gpt-4o
    - claude-3-sonnet
  context_window: 128000
  temperature: 0.3

runtime:
  supported_frameworks:
    - openai-sdk
    - crewai
    - claude-code
    - lyzr
    - langchain
  default_framework: openai-sdk
  exports_directory: exports/

identity:
  soul: SOUL.md
  rules: RULES.md
  duties: DUTIES.md
  explainability: EXPLAINABILITY.md
  fallback_prompt: AGENTS.md

agents:
  - name: sage-reviewer
    path: agents/reviewer/
    role: checker
    description: Independent checker for verifying Sage's STEM explanations.
  - name: sage-tutor
    path: agents/tutor/
    role: adaptive-tutor
    description: Adapts explanations to learner's level and generates practice problems.
  - name: sage-researcher
    path: agents/researcher/
    role: reference-validator
    description: Fetches and validates reference material from curated STEM sources.
  - name: sage-visualizer
    path: agents/visualizer/
    role: visual-explainer
    description: Converts explanations into visual aids (LaTeX, Mermaid, ASCII diagrams).
  - name: sage-translator
    path: agents/translator/
    role: bilingual-translator
    description: Handles English/Hindi translation preserving technical accuracy.
  - name: sage-orchestrator
    path: agents/orchestrator/
    role: workflow-coordinator
    description: Routes queries, manages maker-checker workflow, handles multi-turn state.

skills:
  - name: concept-breakdown
    path: skills/concept-breakdown/
    description: Turn a STEM question into understandable, checkable steps.
  - name: problem-solving
    path: skills/problem-solving/
    description: Guided step-by-step problem-solving with verification.
  - name: analogy-generation
    path: skills/analogy-generation/
    description: Create intuitive analogies for abstract STEM concepts.
  - name: prerequisite-check
    path: skills/prerequisite-check/
    description: Identify knowledge gaps before explaining a concept.
  - name: practice-generation
    path: skills/practice-generation/
    description: Generate practice problems with worked solutions.
  - name: visual-explanation
    path: skills/visual-explanation/
    description: Create diagrams and visual aids to support explanations.
  - name: difficulty-adaptation
    path: skills/difficulty-adaptation/
    description: Dynamically adjust explanation depth based on learner feedback.

tools:
  - name: check-step-logic
    path: tools/check-step-logic.yaml
    description: Inspect reasoning steps for gaps, errors, and inconsistencies.
  - name: lookup-reference
    path: tools/lookup-reference.yaml
    description: Retrieve relevant passages from curated STEM reference sets.
  - name: validate-math
    path: tools/validate-math.yaml
    description: Verify mathematical expressions and computations.
  - name: generate-diagram
    path: tools/generate-diagram.yaml
    description: Create visual representations for STEM concepts.
  - name: assess-understanding
    path: tools/assess-understanding.yaml
    description: Evaluate learner comprehension via targeted questions.
  - name: translate-concept
    path: tools/translate-concept.yaml
    description: Bilingual concept translation with term preservation.
  - name: fetch-reference
    path: tools/fetch-reference.yaml
    description: Retrieve verified reference material with confidence scores.

memory:
  enabled: true
  config: memory/memory-config.yaml
  storage: git-native
  schemas:
    - memory/schemas/learner-profile.yaml
    - memory/schemas/session-log.yaml

hooks:
  pre_tool: hooks/pre-tool.yaml
  post_tool: hooks/post-tool.yaml
  on_error: hooks/on-error.yaml

workflows:
  - name: explain-concept
    path: workflows/explain-concept.yaml
    description: Full concept explanation with prerequisite check, breakdown, review.
  - name: review-and-publish
    path: workflows/review-and-publish.yaml
    description: Maker-checker publication workflow.
  - name: adaptive-tutoring
    path: workflows/adaptive-tutoring.yaml
    description: Multi-turn tutoring session with progress tracking.

compliance:
  safety:
    - No medical, legal, or financial advice disguised as STEM content
    - Flag uncertainty rather than guessing
    - Never fabricate citations or verification status
  data_handling:
    - No persistent storage of personally identifiable information
    - Learner profiles are anonymized
    - Session data is retained only for learning progression
  audit:
    - All changes tracked via git commits
    - Maker-checker workflow enforced for published explanations
    - Review findings are immutable once recorded

examples:
  - examples/math-derivative.md
  - examples/biology-osmosis.md
  - examples/physics-newton-second-law.md
  - examples/chemistry-mole-concept.md
  - examples/cs-big-o-notation.md
  - examples/engineering-ohms-law.md
  - examples/math-integration.md
  - examples/hindi/physics-newton-second-law.md
  - examples/multi-agent-workflow.md

tracks:
  track_01_claw_worker:
    path: claw-worker/
    description: OpenGAP-compliant containerized domain worker runtime for Education/STEM.
  track_02_migration:
    path: migration/
    description: Automated migration suite for porting CrewAI and LangChain agents into OpenGAP.
  track_03_adapters:
    path: adapters/
    description: Pluggable export adapters compiling OpenGAP repositories to Lyzr and LangGraph.
  track_04_guides_and_tooling:
    guides_path: guides/
    validator_path: validator/
    description: OpenGAP enterprise architecture guides and standalone snippet validator tool.

documentation:
  readme: README.md
  architecture: ARCHITECTURE.md
  contributing: CONTRIBUTING.md
  changelog: CHANGELOG.md
