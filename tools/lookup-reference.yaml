name: lookup-reference
description: Retrieve a relevant passage from a curated STEM reference set for grounding an explanation. This is a schema only; runtimes provide the implementation.
input_schema:
  type: object
  additionalProperties: false
  properties:
    query:
      type: string
      description: The concept, theorem, definition, or claim to look up.
      minLength: 1
    subject:
      type: string
      description: Optional STEM subject used to narrow the reference search.
    audience_level:
      type: string
      enum: [school, undergraduate, graduate, general]
      default: general
    max_results:
      type: integer
      minimum: 1
      maximum: 5
      default: 3
  required: [query]
output_schema:
  type: object
  additionalProperties: false
  properties:
    results:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          title:
            type: string
          excerpt:
            type: string
          source_id:
            type: string
          confidence:
            type: number
            minimum: 0
            maximum: 1
        required: [title, excerpt, source_id]
  required: [results]
annotations:
  requires_confirmation: false
  read_only: true
  cost: low
