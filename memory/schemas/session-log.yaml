name: SessionLog
description: Schema for capturing metrics and activities within a single tutoring session.
type: object
properties:
  session_id:
    type: string
    description: Unique identifier for the current session.
  start_time:
    type: string
    format: date-time
  end_time:
    type: string
    format: date-time
  topics_covered:
    type: array
    items:
      type: string
    description: Concepts discussed during this session.
  questions_asked:
    type: integer
    default: 0
    description: Number of questions the learner asked.
  interventions:
    type: array
    items:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum: [hint, correction, motivation, analogy_provided]
        description:
          type: string
  success_rate:
    type: number
    minimum: 0.0
    maximum: 1.0
    description: Percentage of practice questions answered correctly.
required: [session_id, start_time, topics_covered]
